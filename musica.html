<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">
  <meta charset name="viewport"content ="width=device-width">
	<meta name="keywords" content="pagina de lisa 02123">
	<meta name="author" content="juan barrerra">
  <title>El rincón para ti</title> 
 <style>

:root{
  --bg:#121212;
  --card:#1f1f1f;
  --text:#fff;
  --accent:#a64ca6;
  --muted:#555;
}
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding:20px;
  text-align:center;
}
h1{color: var(--accent);}
.playlist{
  display:grid;
  grid-template-columns: repeat(6, 1fr); /* 6 canciones por fila */
  gap:12px;
  margin-bottom:20px;
}
.card{
  background: var(--card);
  border-radius:8px;
  padding:6px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:4px;
  transition: transform .12s, box-shadow .12s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow: 0 4px 12px rgba(166,76,166,0.5);
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:6px;
}
.card .title{
  font-size:12px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.card .artist{
  font-size:11px;
  color: var(--muted);
}

.player-global{
  background: linear-gradient(180deg,#191919,#161616);
  border-radius:10px;
  padding:12px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:20px;
  max-width:980px;
  margin-left:auto;
  margin-right:auto;
}
.cover-small{
  width:64px; height:64px; border-radius:6px; object-fit:cover; background:#0a0a0a;
}
.meta{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}
.meta .title{font-weight:700;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.meta .artist{font-size:12px;color:var(--muted);}
.controls{display:flex;gap:8px;align-items:center;margin-top:6px;}
.btn{
  width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);
  color:#000;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.btn:active{transform:scale(.95);}
.progress-wrap{
  display:flex;align-items:center;gap:6px;margin-top:6px;
}
.time{font-size:12px;color:var(--muted);min-width:36px;text-align:center;}
.progress-bar{
  flex:1;height:6px;background:var(--muted);border-radius:6px;position:relative;cursor:pointer;
}
.progress-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);border-radius:6px;transition:width .08s linear;
}
.nav{margin-top:20px;}
.nav a{color: var(--accent); text-decoration:none; margin:0 8px;font-weight:700;}
.profile{display:block;margin:20px auto;width:150px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.6);}

/* Adaptación móvil */
@media(max-width:1200px){.playlist{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){.playlist{grid-template-columns:repeat(3,1fr);}}
@media(max-width:480px){.playlist{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<h1>🎵 Mi Biblioteca Musical 🎵</h1>

<div class="player-global">
  <img class="cover-small" id="playerCover" src="" alt="cover">
  <div class="meta">
    <div class="title" id="playerTitle">Selecciona una canción</div>
    <div class="artist" id="playerArtist">—</div>
    <div class="controls">
      <button class="btn" id="prevBtn">⏮️</button>
      <button class="btn" id="playBtn">▶️</button>
      <button class="btn" id="nextBtn">⏭️</button>
    </div>
    <div class="progress-wrap">
      <div class="time" id="timeCurrent">0:00</div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time" id="timeTotal">0:00</div>
    </div>
  </div>
</div>

<div class="playlist" id="playlist"></div>

<div class="nav">
  <a href="index.html">inicio</a>
  <a href="frases.html">Lo que no te puedo decir</a>
  <a href="musica.html">Lista de Musica</a>
  <a href="desarrollador.html">Desarrollador</a>
</div>

<img class="profile" src="si.jpg" alt="juan">

<audio id="audio" preload="metadata"></audio>

<script>
const canciones=[
  {titulo:"Golden Hour - JVKE", img:"imagenes/golden hour.jpeg", src:"musica/golden-hour.mp3.mp3.mp3"},
  {titulo:"do-i-wanna - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/doiwannaknow.mp3.mp3.mp3"},
  {titulo:"I Wanna Be Yours - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3.mp3"},
  {titulo:"Hummingbird - Metro Boomin", img:"imagenes/metro-boomin.jpeg", src:"musica/Hummingbird.mp3.mp3.mp3"},
  {titulo:"No. 1 Party Anthem - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3 (2).mp3"},
  {titulo:"Feel It - d4vd", img:"imagenes/feel it.jpeg", src:"musica/feelit.mp3.mp3"},
  {titulo:"Sabor a mi - Luis Miguel", img:"imagenes/sabor a ti.jpeg", src:"musica/sabor-a-mi.mp3"},
  {titulo:"Feliz me siento", img:"imagenes/feliz me siento.jpeg", src:"musica/feliz-me-siento.mp3"},
  {titulo:"Quiero morir en tu piel", img:"imagenes/quiero morir en tu piel.jpeg", src:"musica/quiero-morir-en-tu-piel.mp3"},
  {titulo:"Dónde nadie puede ir", img:"imagenes/donde nadie puede ir.jpeg", src:"musica/donde-nadie-puede-ir.mp3"},
  {titulo:"Bésame", img:"imagenes/besame.jpeg", src:"musica/Besame.mp3"},
  {titulo:"Congratulations", img:"imagenes/donde nadie puede ir.jpeg", src:"musica/creeping.mp3.mp3.mp3"}
];

const playlistEl=document.getElementById('playlist');
const playerCover=document.getElementById('playerCover');
const playerTitle=document.getElementById('playerTitle');
const playerArtist=document.getElementById('playerArtist');
const playBtn=document.getElementById('playBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
const timeCurrent=document.getElementById('timeCurrent');
const timeTotal=document.getElementById('timeTotal');
const audio=document.getElementById('audio');

let currentIndex=-1;

function fmtTime(sec){
  if(!isFinite(sec)) return '0:00';
  const s=Math.floor(sec%60), m=Math.floor(sec/60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function renderList(){
  playlistEl.innerHTML='';
  canciones.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<img src="${encodeURI(c.img)}" alt="${c.titulo}"><div class="title">${c.titulo}</div>`;
    card.addEventListener('click',()=>loadAndPlay(i));
    playlistEl.appendChild(card);
  });
}

async function loadAndPlay(index){
  const c=canciones[index];
  if(!c) return;
  currentIndex=index;
  playerTitle.textContent=c.titulo;
  playerArtist.textContent=c.src.split('/').pop();
  playerCover.src=encodeURI(c.img);
  audio.src=encodeURI(c.src);
  audio.load();
  try{await audio.play();playBtn.textContent='⏸️';}catch(e){console.warn(e);}
}

playBtn.addEventListener('click',async()=>{
  if(audio.paused){await audio.play();playBtn.textContent='⏸️';}
  else{audio.pause();playBtn.textContent='▶️';}
});

prevBtn.addEventListener('click',()=>{if(currentIndex>0)loadAndPlay(currentIndex-1);});
nextBtn.addEventListener('click',()=>{if(currentIndex<canciones.length-1)loadAndPlay(currentIndex+1);});

audio.addEventListener('timeupdate',()=>{
  if(audio.duration){
    const pct=(audio.currentTime/audio.duration)*100;
    progressFill.style.width=pct+'%';
    timeCurrent.textContent=fmtTime(audio.currentTime);
    timeTotal.textContent=fmtTime(audio.duration);
  }
});
audio.addEventListener('ended',()=>{
  playBtn.textContent='▶️';
  if(currentIndex<canciones.length-1)loadAndPlay(currentIndex+1);
  else{progressFill.style.width='0%';timeCurrent.textContent='0:00';}
});

progressBar.addEventListener('click',(e)=>{
  if(!audio.duration) return;
  const rect=progressBar.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  audio.currentTime=pct*audio.duration;
});

renderList();
</script>

</body>
</html>
