<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width"> 
  <meta name="keywords" content="pagina de lisa 02123"> 
  <meta name="author" content="juan barrerra"> 
  <title>El rincón para ti</title>
<style>
:root{
  --page-bg: #808080;
  --card-bg: #1f1f1f;
  --text: #ffffff;
  --accent: #a64ca6;
  --muted: #bfbfbf;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--page-bg);
  color: var(--text);
}
.container{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
  text-align:center;
}
h1{ margin:0 0 18px; color:var(--accent); }
.player-global{
  background: linear-gradient(180deg,#1b1b1b,#161616);
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:flex-start;
  margin:0 auto 20px;
  max-width:1000px;
  border:1px solid rgba(255,255,255,0.04);
}
#playerVideo{
  border-radius:10px;
  width:320px;
  height:180px;
  flex-shrink:0;
}
.meta-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
}
.cover-small{
  width:64px; height:64px; border-radius:8px; object-fit:cover; background:#0a0a0a;
}
.meta{ display:flex; flex-direction:column; align-items:flex-start; }
.meta .title{ font-weight:700; font-size:15px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:650px; }
.meta .artist{ font-size:12px; color:var(--muted); }
.controls{ display:flex; gap:8px; align-items:center; margin-top:8px; }
.btn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--accent); color:#000; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.btn:active{ transform:scale(.96); }
.progress-wrap{ display:flex; align-items:center; gap:8px; margin-top:8px; width:100%; }
.time{ font-size:12px; color:var(--muted); min-width:40px; text-align:center; }
.progress-bar{ flex:1; height:6px; background: rgba(255,255,255,0.15); border-radius:6px; position:relative; cursor:pointer; overflow:hidden; }
.progress-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent); border-radius:6px; transition:width .08s linear; }

.playlist{
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  gap:12px;
  margin:0 auto 24px;
  width:100%;
  max-width:1200px;
  justify-items:stretch;
}
.card{
  background: var(--card-bg);
  border-radius:10px;
  padding:8px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:stretch;
  min-height:160px;
  transition: transform .12s, box-shadow .12s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow: 0 8px 20px rgba(166,76,166,0.2);
}
.thumb{
  width:100%;
  aspect-ratio: 1 / 1;
  border-radius:8px;
  overflow:hidden;
  background:#0a0a0a;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.title{
  font-size:12px;
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.playlist .card:last-child{
  grid-column: 3 / span 2;
  justify-self: center;
  max-width: 320px;
}
@media (max-width:1200px){
  .playlist{ grid-template-columns: repeat(4,1fr); }
  .playlist .card:last-child{ grid-column: 2 / span 2; max-width: 360px; }
}
@media (max-width:768px){
  .playlist{ grid-template-columns: repeat(3,1fr); }
  .playlist .card:last-child{ grid-column: 2 / span 1; max-width: 320px; }
}
@media (max-width:480px){
  .playlist{ grid-template-columns: repeat(2,1fr); gap:10px; }
  .playlist .card:last-child{ grid-column: 1 / -1; justify-self:center; max-width: 90%; }
}
.nav{ margin-top:8px; text-align:center; }
.nav a{ color:var(--accent); text-decoration:none; margin:0 8px; font-weight:700; }
.profile{ display:block; margin:20px auto 40px; width:140px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.4); }
</style>
</head>
<body>
  <div class="container">
    <h1>🎵 Mi Biblioteca Musical 🎵</h1>

    <div class="player-global" role="region" aria-label="Reproductor">
      <video id="playerVideo" controls></video>
      
      <div class="meta-wrap">
        <img class="cover-small" id="playerCover" src="" alt="cover">
        <div class="meta">
          <div class="title" id="playerTitle">Selecciona una canción</div>
          <div class="artist" id="playerArtist">—</div>
        </div>
      </div>
    </div>

    <div class="playlist" id="playlist" role="list" aria-label="Lista de canciones"></div>

    <div class="nav">
      <a href="index.html">inicio</a>
      <a href="frases.html">Lo que no te puedo decir</a>
      <a href="musica.html">Lista de Musica</a>
      <a href="desarrollador.html">Desarrollador</a>
    </div>

    <img class="profile" src="si.jpg" alt="juan">
  </div>

<script>
  const canciones=[
  {titulo:"Golden Hour - JVKE", img:"imagenes/golden hour.jpeg", src:"musica/golden-hour.mp3.mp3.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"do-i-wanna - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/doiwannaknow.mp3.mp3.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"I Wanna Be Yours - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Hummingbird - Metro Boomin", img:"imagenes/metro-boomin.jpeg", src:"musica/Hummingbird.mp3.mp3.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"No. 1 Party Anthem - Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3 (2).mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Feel It - d4vd", img:"imagenes/feel it.jpeg", src:"musica/feelit.mp3.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Sabor a mi - Luis Miguel", img:"imagenes/sabor a ti.jpeg", src:"musica/sabor-a-mi.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Feliz me siento", img:"imagenes/feliz me siento.jpeg", src:"musica/feliz-me-siento.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Quiero morir en tu piel", img:"imagenes/quiero morir en tu piel.jpeg", src:"musica/quiero-morir-en-tu-piel.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Dónde nadie puede ir", img:"imagenes/donde nadie puede ir.jpeg", src:"musica/donde-nadie-puede-ir.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Bésame", img:"imagenes/besame.jpeg", src:"musica/Besame.mp3", video:"videos/golden-hour.mp4"},
  {titulo:"Congratulations", img:"imagenes/Congratulations.jpeg", src:"musica/creeping.mp3.mp3.mp3", video:"videos/golden-hour.mp4"}
  {titulo:"her", img:"imagenes/her.jpeg", src:"musica/her.mp3", video:"videos/golden-hour.mp4"}
];
  
];

const playlistEl = document.getElementById('playlist');
const playerCover = document.getElementById('playerCover');
const playerTitle = document.getElementById('playerTitle');
const playerArtist = document.getElementById('playerArtist');
const playerVideo = document.getElementById('playerVideo');

let currentIndex = 0;

// Render playlist
function renderList(){
  playlistEl.innerHTML = '';
  canciones.forEach((c,i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = encodeURI(c.img);
    img.alt = c.titulo;
    thumb.appendChild(img);

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = c.titulo;

    card.appendChild(thumb);
    card.appendChild(title);

    card.addEventListener('click', () => setTrack(i));

    playlistEl.appendChild(card);
  });
}

function setTrack(index){
  const c = canciones[index];
  if(!c) return;
  currentIndex = index;
  playerTitle.textContent = c.titulo;
  playerArtist.textContent = c.artista || 'Desconocido';
  playerCover.src = encodeURI(c.img);

  if (c.video){
    playerVideo.src = encodeURI(c.video);
    playerVideo.load();
    // El usuario decide cuándo reproducir con los controles
  } else {
    playerVideo.src = "";
    playerVideo.load();
  }
}

renderList();
setTrack(currentIndex);
</script>
</body>
</html>
