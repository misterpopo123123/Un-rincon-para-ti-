<!DOCTYPE html> <html> 
  <head> <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width"> 
  <meta name="keywords" content="pagina de lisa 02123"> 
  <meta name="author" content="juan barrerra"> 
  <title>El rincón para ti</title>
<style>
:root{
  --bg:#808080;        /* Fondo gris */
  --card:#1f1f1f;      /* Tarjetas oscuras */
  --text:#fff;
  --accent:#a64ca6;    /* Lila */
  --muted:#bbb;        /* Texto tenue más claro sobre gris */
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding:20px;
  text-align:center;
}

h1{color: var(--accent); margin: 0 0 16px}

.playlist{
  display:grid;
  grid-template-columns: repeat(6, 1fr); /* 6 por fila en desktop */
  gap:12px;
  margin-bottom:20px;
  max-width: 1200px;
  margin-left:auto;
  margin-right:auto;
}

.card{
  background: var(--card);
  border-radius:10px;
  padding:8px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition: transform .12s, box-shadow .12s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow: 0 6px 16px rgba(166,76,166,0.4);
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
  background:#0a0a0a;
}
.card .title{
  font-size:12px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#fff;
}

.player-global{
  background: linear-gradient(180deg,#1b1b1b,#161616);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  margin: 0 auto 20px;
  max-width:980px;
  border:1px solid rgba(255,255,255,.06);
}
.cover-small{
  width:64px; height:64px; border-radius:8px; object-fit:cover; background:#0a0a0a;
}
.meta{
  flex:1; min-width:220px;
  display:flex; flex-direction:column; align-items:flex-start;
}
.meta .title{font-weight:700;font-size:14px;max-width:520px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.meta .artist{font-size:12px;color:var(--muted);}
.controls{display:flex;gap:8px;align-items:center;margin-top:6px;}
.btn{
  width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);
  color:#000;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
.btn:active{transform:scale(.96);}
.progress-wrap{display:flex;align-items:center;gap:8px;margin-top:6px;width:100%;}
.time{font-size:12px;color:var(--muted);min-width:38px;text-align:center;}
.progress-bar{
  flex:1;height:6px;background:rgba(255,255,255,.18);
  border-radius:6px;position:relative;cursor:pointer;overflow:hidden;
}
.progress-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:var(--accent);border-radius:6px;transition:width .08s linear;
}

/* Navegación inferior */
.nav{margin-top:8px}
.nav a{color: var(--accent); text-decoration:none; margin:0 10px;font-weight:700}

/* Foto */
.profile{display:block;margin:20px auto;width:150px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.6);}

/* Responsive */
@media(max-width:1200px){.playlist{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){.playlist{grid-template-columns:repeat(3,1fr);} .meta{min-width:180px}}
@media(max-width:480px){.playlist{grid-template-columns:repeat(2,1fr);} .cover-small{width:56px;height:56px}}
</style>
</head>
<body>

<h1>🎵 Mi Biblioteca Musical 🎵</h1>

<!-- Reproductor global -->
<div class="player-global">
  <img class="cover-small" id="playerCover" src="" alt="cover">
  <div class="meta">
    <div class="title" id="playerTitle">Selecciona una canción</div>
    <div class="artist" id="playerArtist">—</div>
    <div class="controls">
      <button class="btn" id="prevBtn" title="Anterior">⏮️</button>
      <button class="btn" id="playBtn" title="Reproducir / Pausar">▶️</button>
      <button class="btn" id="nextBtn" title="Siguiente">⏭️</button>
    </div>
    <div class="progress-wrap">
      <div class="time" id="timeCurrent">0:00</div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time" id="timeTotal">0:00</div>
    </div>
  </div>
</div>

<!-- Grilla de canciones -->
<div class="playlist" id="playlist"></div>

<!-- Navegación -->
<div class="nav">
  <a href="index.html">inicio</a>
  <a href="frases.html">Lo que no te puedo decir</a>
  <a href="musica.html">Lista de Musica</a>
  <a href="desarrollador.html">Desarrollador</a>
</div>

<!-- Foto -->
<img class="profile" src="si.jpg" alt="juan">

<!-- Único elemento de audio (sin controles nativos) -->
<audio id="audio" preload="metadata"></audio>

<script>
/* === Lista: NO tocamos tus rutas === */
const canciones=[
  {titulo:"Golden Hour - JVKE",                 img:"imagenes/golden hour.jpeg",            src:"musica/golden-hour.mp3.mp3.mp3"},
  {titulo:"do-i-wanna - Arctic Monkeys",        img:"imagenes/artic-monkeys.jpeg",          src:"musica/doiwannaknow.mp3.mp3.mp3"},
  {titulo:"I Wanna Be Yours - Arctic Monkeys",  img:"imagenes/artic-monkeys.jpeg",          src:"musica/arctic.mp3.mp3.mp3"},
  {titulo:"Hummingbird - Metro Boomin",         img:"imagenes/metro-boomin.jpeg",           src:"musica/Hummingbird.mp3.mp3.mp3"},
  {titulo:"No. 1 Party Anthem - Arctic Monkeys",img:"imagenes/artic-monkeys.jpeg",          src:"musica/arctic.mp3.mp3 (2).mp3"},
  {titulo:"Feel It - d4vd",                     img:"imagenes/feel it.jpeg",                src:"musica/feelit.mp3.mp3"},
  {titulo:"Sabor a mi - Luis Miguel",           img:"imagenes/sabor a ti.jpeg",             src:"musica/sabor-a-mi.mp3"},
  {titulo:"Feliz me siento",                    img:"imagenes/feliz me siento.jpeg",        src:"musica/feliz-me-siento.mp3"},
  {titulo:"Quiero morir en tu piel",            img:"imagenes/quiero morir en tu piel.jpeg",src:"musica/quiero-morir-en-tu-piel.mp3"},
  {titulo:"Dónde nadie puede ir",               img:"imagenes/donde nadie puede ir.jpeg",   src:"musica/donde-nadie-puede-ir.mp3"},
  {titulo:"Bésame",                              img:"imagenes/besame.jpeg",                 src:"musica/Besame.mp3"},
  {titulo:"Congratulations",                    img:"imagenes/Congratulations.jpeg",        src:"musica/creeping.mp3.mp3.mp3"},
  {titulo:"Ansiedades",                          img:"imagenes/ansiedades.jpeg",             src:"musica/ansiedades.mp3"}
];

const $ = id => document.getElementById(id);
const playlistEl   = $('playlist');
const playerCover  = $('playerCover');
const playerTitle  = $('playerTitle');
const playerArtist = $('playerArtist');
const playBtn      = $('playBtn');
const prevBtn      = $('prevBtn');
const nextBtn      = $('nextBtn');
const progressBar  = $('progressBar');
const progressFill = $('progressFill');
const timeCurrent  = $('timeCurrent');
const timeTotal    = $('timeTotal');
const audio        = $('audio');

let currentIndex = 0; // cargamos la primera pista (sin autoplay)

/* Formatea mm:ss */
function fmtTime(sec){
  if(!isFinite(sec)) return '0:00';
  const s = Math.floor(sec % 60);
  const m = Math.floor(sec / 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

/* Render de tarjetas */
function renderList(){
  playlistEl.innerHTML='';
  canciones.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <img src="${encodeURI(c.img)}" alt="${c.titulo}">
      <div class="title" title="${c.titulo}">${c.titulo}</div>
    `;
    card.addEventListener('click',()=> loadAndPlay(i));
    playlistEl.appendChild(card);
  });
}

/* Carga EN EL PLAYER (no reproduce) */
function setTrack(index){
  const c = canciones[index];
  if(!c) return;
  currentIndex = index;
  playerTitle.textContent = c.titulo;
  playerArtist.textContent = c.src.split('/').pop();
  playerCover.src = encodeURI(c.img);
  audio.src = encodeURI(c.src);
  audio.load(); // carga metadata
}

/* Carga y reproduce (tras click del usuario) */
async function loadAndPlay(index){
  setTrack(index);
  try{
    await audio.play();
    playBtn.textContent='⏸️';
  }catch(e){
    console.warn('Bloqueado por el navegador hasta interacción del usuario:', e);
  }
}

/* Controles */
playBtn.addEventListener('click', async ()=>{
  if(audio.paused){
    try{ await audio.play(); playBtn.textContent='⏸️'; }
    catch(e){ console.warn(e); }
  }else{
    audio.pause(); playBtn.textContent='▶️';
  }
});
prevBtn.addEventListener('click', ()=> {
  const i = (currentIndex-1+ canciones.length) % canciones.length;
  loadAndPlay(i);
});
nextBtn.addEventListener('click', ()=> {
  const i = (currentIndex+1) % canciones.length;
  loadAndPlay(i);
});

/* Progreso */
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration){
    const pct = (audio.currentTime/audio.duration)*100;
    progressFill.style.width = pct+'%';
    timeCurrent.textContent  = fmtTime(audio.currentTime);
    timeTotal.textContent    = fmtTime(audio.duration);
  }
});
audio.addEventListener('loadedmetadata', ()=>{
  timeTotal.textContent = fmtTime(audio.duration);
});
audio.addEventListener('ended', ()=>{
  playBtn.textContent='▶️';
  // Autonext
  const i = (currentIndex+1) % canciones.length;
  setTrack(i);            // prepara la siguiente
  // No auto-play para evitar bloqueos; el usuario puede dar play
});

progressBar.addEventListener('click', (e)=>{
  if(!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

/* Inicialización */
renderList();
setTrack(currentIndex); // muestra la primera pista sin reproducir
</script>

</body>
</html>
