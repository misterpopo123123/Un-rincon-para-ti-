<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width"> 
  <meta name="keywords" content="pagina de lisa 02123"> 
  <meta name="author" content="juan barrerra"> 
  <title>El rincón para ti</title>
<style>
:root{
  --page-bg: #808080;   /* fondo gris de la página */
  --card-bg: #1f1f1f;
  --text: #ffffff;
  --accent: #a64ca6;
  --muted: #bfbfbf;
}

/* Layout base y centrado */
*{box-sizing:border-box}
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--page-bg);
  color: var(--text);
}
.container{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
  text-align:center;
}

/* Título */
h1{ margin:0 0 18px; color:var(--accent); }

/* Reproductor global */
.player-global{
  background: linear-gradient(180deg,#1b1b1b,#161616);
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  margin:0 auto 20px;
  max-width:1000px;
  border:1px solid rgba(255,255,255,0.04);
}
.cover-small{
  width:64px; height:64px; border-radius:8px; object-fit:cover; background:#0a0a0a;
}
.meta{ flex:1; min-width:220px; display:flex; flex-direction:column; align-items:flex-start; }
.meta .title{ font-weight:700; font-size:15px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:650px; }
.meta .artist{ font-size:12px; color:var(--muted); }
.controls{ display:flex; gap:8px; align-items:center; margin-top:8px; }
.btn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--accent); color:#000; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.btn:active{ transform:scale(.96); }
.progress-wrap{ display:flex; align-items:center; gap:8px; margin-top:8px; width:100%; }
.time{ font-size:12px; color:var(--muted); min-width:40px; text-align:center; }
.progress-bar{ flex:1; height:6px; background: rgba(255,255,255,0.15); border-radius:6px; position:relative; cursor:pointer; overflow:hidden; }
.progress-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent); border-radius:6px; transition:width .08s linear; }

/* PLAYLIST */
.playlist{
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  gap:12px;
  margin:0 auto 24px;
  width:100%;
  max-width:1200px;
  justify-items:stretch;
}

/* tarjeta */
.card{
  background: var(--card-bg);
  border-radius:10px;
  padding:8px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:8px;
  transition: transform .12s, box-shadow .12s;
  align-items:stretch;
  min-height: 160px;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow: 0 8px 20px rgba(166,76,166,0.2);
}

/* thumbnail cuadrado con <img> */
.thumb{
  width:100%;
  aspect-ratio: 1 / 1;
  border-radius:8px;
  overflow:hidden;
  background:#0a0a0a;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover; /* mantiene proporción */
  display:block;
}

/* título */
.title{
  font-size:12px;
  font-weight:700;
  color:var(--text);
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

/* última tarjeta centrada */
.playlist .card:last-child{
  grid-column: 3 / span 2;
  justify-self: center;
  max-width: 320px;
}

/* Table */
@media (max-width:1200px){
  .playlist{ grid-template-columns: repeat(4,1fr); }
  .playlist .card:last-child{ grid-column: 2 / span 2; max-width: 360px; }
}

/* Tablet */
@media (max-width:768px){
  .playlist{ grid-template-columns: repeat(3,1fr); }
  .playlist .card:last-child{ grid-column: 2 / span 1; max-width: 320px; }
}

/* Mobile */
@media (max-width:480px){
  .playlist{ grid-template-columns: repeat(2,1fr); gap:10px; }
  .playlist .card:last-child{ grid-column: 1 / -1; justify-self:center; max-width: 90%; }
}

/* navegación y perfil */
.nav{ margin-top:8px; text-align:center; }
.nav a{ color:var(--accent); text-decoration:none; margin:0 8px; font-weight:700; }
.profile{ display:block; margin:20px auto 40px; width:140px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.4); }
</style>
</head>
<body>
  <div class="container">
    <h1>🎵 Mi Biblioteca Musical 🎵</h1>

    <!-- Reproductor -->
    <div class="player-global" role="region" aria-label="Reproductor">
      <img class="cover-small" id="playerCover" src="" alt="cover">
      <div class="meta">
        <div class="title" id="playerTitle">Selecciona una canción</div>
        <div class="artist" id="playerArtist">—</div>
        <div class="controls" role="group" aria-label="Controles">
          <button class="btn" id="prevBtn" title="Anterior">⏮️</button>
          <button class="btn" id="playBtn" title="Reproducir">▶️</button>
          <button class="btn" id="nextBtn" title="Siguiente">⏭️</button>
        </div>
        <div class="progress-wrap" aria-hidden="false">
          <div class="time" id="timeCurrent">0:00</div>
          <div class="progress-bar" id="progressBar" title="Click para saltar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time" id="timeTotal">0:00</div>
        </div>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist" id="playlist" role="list" aria-label="Lista de canciones"></div>

    <div class="nav">
      <a href="index.html">inicio</a>
      <a href="frases.html">Lo que no te puedo decir</a>
      <a href="musica.html">Lista de Musica</a>
      <a href="desarrollador.html">Desarrollador</a>
    </div>

    <img class="profile" src="si.jpg" alt="juan">
    <audio id="audio" preload="metadata"></audio>
  </div>

<script>
/* Lista */
const canciones = [
  {titulo:"Golden Hour", artista:"JVKE", img:"imagenes/golden hour.jpeg", src:"musica/golden-hour.mp3.mp3.mp3"},
  {titulo:"Do I Wanna Know?", artista:"Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/doiwannaknow.mp3.mp3.mp3"},
  {titulo:"I Wanna Be Yours", artista:"Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3.mp3"},
  {titulo:"Hummingbird", artista:"Metro Boomin", img:"imagenes/metro-boomin.jpeg", src:"musica/Hummingbird.mp3.mp3.mp3"},
  {titulo:"No. 1 Party Anthem", artista:"Arctic Monkeys", img:"imagenes/artic-monkeys.jpeg", src:"musica/arctic.mp3.mp3 (2).mp3"},
  {titulo:"Feel It", artista:"d4vd", img:"imagenes/feel it.jpeg", src:"musica/feelit.mp3.mp3"},
  {titulo:"Sabor a mí", artista:"Luis Miguel", img:"imagenes/sabor a ti.jpeg", src:"musica/sabor-a-mi.mp3"},
  {titulo:"Feliz me siento", artista:"Desconocido", img:"imagenes/feliz me siento.jpeg", src:"musica/feliz-me-siento.mp3"},
  {titulo:"Quiero morir en tu piel", artista:"Desconocido", img:"imagenes/quiero morir en tu piel.jpeg", src:"musica/quiero-morir-en-tu-piel.mp3"},
  {titulo:"Dónde nadie puede ir", artista:"Desconocido", img:"imagenes/donde nadie puede ir.jpeg", src:"musica/donde-nadie-puede-ir.mp3"},
  {titulo:"Bésame", artista:"Desconocido", img:"imagenes/besame.jpeg", src:"musica/Besame.mp3"},
  {titulo:"Congratulations", artista:"Post Malone", img:"imagenes/Congratulations.jpeg", src:"musica/creeping.mp3.mp3.mp3"},
  {titulo:"Ansiedades", artista:"Desconocido", img:"imagenes/ansiedades.jpeg", src:"musica/ansiedades.mp3"}
];

const $ = id => document.getElementById(id);
const playlistEl = $('playlist');
const playerCover = $('playerCover');
const playerTitle = $('playerTitle');
const playerArtist = $('playerArtist');
const playBtn = $('playBtn');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const progressBar = $('progressBar');
const progressFill = $('progressFill');
const timeCurrent = $('timeCurrent');
const timeTotal = $('timeTotal');
const audio = $('audio');

let currentIndex = 0;

/* formatea tiempo mm:ss */
function fmtTime(sec){
  if(!isFinite(sec)) return '0:00';
  const s = Math.floor(sec % 60), m = Math.floor(sec / 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

/* Renderiza tarjetas */
function renderList(){
  playlistEl.innerHTML = '';
  canciones.forEach((c,i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = encodeURI(c.img);
    img.alt = c.titulo;
    thumb.appendChild(img);

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = c.titulo;

    card.appendChild(thumb);
    card.appendChild(title);
    card.addEventListener('click', () => loadAndPlay(i));
    playlistEl.appendChild(card);
  });
}

/* Carga pista */
function setTrack(index){
  const c = canciones[index];
  if(!c) return;
  currentIndex = index;
  playerTitle.textContent = c.titulo;
  playerArtist.textContent = c.artista || 'Desconocido';
  playerCover.src = encodeURI(c.img);
  audio.src = encodeURI(c.src);
  audio.load();
}

/* Carga + reproduce */
async function loadAndPlay(index){
  setTrack(index);
  try{
    await audio.play();
    playBtn.textContent = '⏸️';
    playBtn.setAttribute('aria-label','Pausar');
  }catch(err){
    console.warn('play blocked until user gesture or file missing', err);
  }
}

/* controles */
playBtn.addEventListener('click', async () => {
  if(!audio.src){
    setTrack(0);
    return;
  }
  if(audio.paused){
    try{ 
      await audio.play(); 
      playBtn.textContent='⏸️'; 
      playBtn.setAttribute('aria-label','Pausar'); 
    } catch(e){ console.warn(e); }
  } else {
    audio.pause(); 
    playBtn.textContent='▶️';
    playBtn.setAttribute('aria-label','Reproducir');
  }
});
prevBtn.addEventListener('click', () => {
  const i = (currentIndex - 1 + canciones.length) % canciones.length;
  loadAndPlay(i);
});
nextBtn.addEventListener('click', () => {
  const i = (currentIndex + 1) % canciones.length;
  loadAndPlay(i);
});

/* progreso */
audio.addEventListener('timeupdate', () => {
  if(audio.duration){
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    timeCurrent.textContent = fmtTime(audio.currentTime);
    timeTotal.textContent = fmtTime(audio.duration);
  }
});
audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmtTime(audio.duration);
});
audio.addEventListener('ended', () => {
  const i = (currentIndex + 1) % canciones.length;
  loadAndPlay(i);
});

/* click en barra */
progressBar.addEventListener('click', (e) => {
  if(!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

/* INIT */
renderList();
setTrack(currentIndex);
</script>
</body>
</html>
